apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: rimo-api-ingress
  namespace: default

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # Terraform에서 만든 ALB Security Group
    alb.ingress.kubernetes.io/security-groups: ALB_SECURITY_GROUP_ID

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'

    # Terraform apply 후 실제 ARN으로 교체
    alb.ingress.kubernetes.io/certificate-arn: ACM_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/wafv2-acl-arn: WAF_WEB_ACL_ARN

spec:
  ingressClassName: alb

  rules:
    - host: api.rimo-app.com
      http:
        paths:

          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-api
                port:
                  number: 80

          - path: /member
            pathType: Prefix
            backend:
              service:
                name: member-api
                port:
                  number: 80

          - path: /tracking
            pathType: Prefix
            backend:
              service:
                name: tracking-api
                port:
                  number: 80

          - path: /route
            pathType: Prefix
            backend:
              service:
                name: route-api
                port:
                  number: 80

          - path: /data
            pathType: Prefix
            backend:
              service:
                name: data-api
                port:
                  number: 80
