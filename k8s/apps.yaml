# =========================================================
# AUTH API - 8080
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: default
spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: auth-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: auth-api
          matchLabelKeys:
            - pod-template-hash

        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: auth-api
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: auth-api
          image: 110844250782.dkr.ecr.ap-northeast-2.amazonaws.com/rimo/auth-api:latest
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: rimo-config
            - secretRef:
                name: rimo-secret

          env:
            - name: SERVER_PORT
              value: "8080"

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: auth-api
  ports:
    - port: 80
      targetPort: 8080


