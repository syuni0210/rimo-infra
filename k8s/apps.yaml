# =========================================================
# AUTH API
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: default
spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: auth-api

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: auth-api

      containers:
        - name: auth-api
          image: AUTH_API_IMAGE
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: rimo-config
            - secretRef:
                name: rimo-secret

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: auth-api
  ports:
    - port: 80
      targetPort: 8080


